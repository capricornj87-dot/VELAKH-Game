name: VELAKH Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 다운로드
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Android 프로젝트 압축 해제
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-project

          unzip -o \
            VELAKH_Android_CI_Build_v2.2.zip \
            -d android-project

          echo "=== Extracted files ==="
          find android-project -maxdepth 4 -type f | head -80

      # 3. Java 17 설치
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 기존 Android SDK 사용
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 5. Android SDK 구성요소 설치
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 6. Gradle 8.9 설정
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Android 프로젝트 경로 검색
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          BUILD_FILE="$(find android-project \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | grep -v '/app/' \
            | head -1)"

          if [ -z "$BUILD_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      # 8. APK 빌드
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      # 9. 생성된 APK 검색
      - name: Locate APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          find android-project \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-output/ \;

          echo "=== APK files ==="
          ls -lh apk-output/

          if ! find apk-output -name "*.apk" | grep -q .; then
            echo "APK was not generated"
            exit 1
          fi

      # 10. APK 다운로드 파일 등록
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VELAKH-Android-Test-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
